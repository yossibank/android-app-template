name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Build and test
    # Android のみなので macOS ランナーは不要
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 一時的にキャッシュを無効化して、実際にネットワークから解決できるか検証する
          cache-disabled: true

      - name: Verify
        run: make verify
        env:
          # settings.gradle.kts が gpr.user / gpr.token の次に読む変数
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
