name: Verify

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debug:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::724669215656:role/android-app-template-read
          aws-region: ap-northeast-1

      - name: Get the CodeArtifact token
        run: |
          token="$(aws codeartifact get-authorization-token --domain yossibank --domain-owner 724669215656 --query authorizationToken --output text)"
          echo "::add-mask::$token"
          echo "CODEARTIFACT_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify
        run: make verify-debug

  release:
    name: Release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::724669215656:role/android-app-template-read
          aws-region: ap-northeast-1

      - name: Get the CodeArtifact token
        run: |
          token="$(aws codeartifact get-authorization-token --domain yossibank --domain-owner 724669215656 --query authorizationToken --output text)"
          echo "::add-mask::$token"
          echo "CODEARTIFACT_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Release build
        run: make release
