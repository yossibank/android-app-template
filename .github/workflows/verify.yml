name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: make verify
        env:
          # settings.gradle.kts が gpr.user / gpr.token の次に読む変数
          GITHUB_ACTOR: ${{ github.actor }}
          # 共通コアが private の場合、GITHUB_TOKEN では別リポジトリのパッケージを
          # 読めない（Could not find com.yossibank:shared:x.y.z になる）。permissions に
          # packages: read があっても足りないことを実際に private へ切り替えて確認した。
          # その場合は SHARED_CORE_TOKEN に read:packages を持つ PAT を登録する。
          # public の間は GITHUB_TOKEN で足りる。
          GITHUB_TOKEN: ${{ secrets.SHARED_CORE_TOKEN || secrets.GITHUB_TOKEN }}
