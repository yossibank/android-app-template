name: Verify

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debug:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read the CodeArtifact settings
        id: codeartifact
        run: sed -n 's/^codeArtifact\.\([a-z]*\)=/\1=/p' gradle.properties >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ steps.codeartifact.outputs.owner }}:role/${{ github.event.repository.name }}-read
          aws-region: ${{ steps.codeartifact.outputs.region }}

      - name: Get the CodeArtifact token
        env:
          DOMAIN: ${{ steps.codeartifact.outputs.domain }}
          OWNER: ${{ steps.codeartifact.outputs.owner }}
        run: |
          token="$(aws codeartifact get-authorization-token --domain "$DOMAIN" --domain-owner "$OWNER" --query authorizationToken --output text)"
          echo "::add-mask::$token"
          echo "ORG_GRADLE_PROJECT_codeArtifactPassword=$token" >> "$GITHUB_ENV"

      - name: Verify
        run: make verify-debug

  release:
    name: Release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read the CodeArtifact settings
        id: codeartifact
        run: sed -n 's/^codeArtifact\.\([a-z]*\)=/\1=/p' gradle.properties >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ steps.codeartifact.outputs.owner }}:role/${{ github.event.repository.name }}-read
          aws-region: ${{ steps.codeartifact.outputs.region }}

      - name: Get the CodeArtifact token
        env:
          DOMAIN: ${{ steps.codeartifact.outputs.domain }}
          OWNER: ${{ steps.codeartifact.outputs.owner }}
        run: |
          token="$(aws codeartifact get-authorization-token --domain "$DOMAIN" --domain-owner "$OWNER" --query authorizationToken --output text)"
          echo "::add-mask::$token"
          echo "ORG_GRADLE_PROJECT_codeArtifactPassword=$token" >> "$GITHUB_ENV"

      - name: Release build
        run: make release
